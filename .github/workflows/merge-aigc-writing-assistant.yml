name: Merge aigc-writing_assistant

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy current aigc-writing_assistant snapshot
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aigc-writing_assistant
          mkdir -p aigc-writing_assistant
          git clone --depth 1 --branch master https://github.com/Capybaring/aigc-writing_assistant.git /tmp/aigc-writing_assistant
          rsync -a --exclude='.git' /tmp/aigc-writing_assistant/ aigc-writing_assistant/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aigc-writing_assistant

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Merge aigc-writing_assistant into bachelor repository"
            git push origin master
          fi
